<!DOCTYPE html>
<html>
<head>
<title>My AI</title>
</head>
<body style="background:#111111;color:#eeeeee;font-family:sans-serif;padding:20px;">

<h1>My AI</h1>

<p>Worker URL:</p>
<input type="text" id="workerUrl" style="width:100%;padding:8px;">

<p>API Key:</p>
<input type="text" id="apiKey" style="width:100%;padding:8px;">

<p>Message:</p>
<textarea id="promptBox" style="width:100%;padding:8px;height:60px;"></textarea>

<p><button id="sendBtn" onclick="sendMessage()">Send</button></p>

<div id="output" style="white-space:pre-wrap;margin-top:20px;padding:10px;background:#222222;"></div>

<script>
var chatHistory = [];

function sendMessage() {
  var workerUrl = document.getElementById("workerUrl").value;
  var apiKey = document.getElementById("apiKey").value;
  var promptText = document.getElementById("promptBox").value;
  var output = document.getElementById("output");

  if (promptText === "") {
    return;
  }

  output.innerHTML = output.innerHTML + "\nYou: " + promptText;

  var headers = new Headers();
  headers.append("Authorization", "Bearer " + apiKey);
  headers.append("Content-Type", "application/json");

  var bodyData = JSON.stringify({ prompt: promptText, history: chatHistory });

  fetch(workerUrl, { method: "POST", headers: headers, body: bodyData })
    .then(function(res) {
      return res.json();
    })
    .then(function(data) {
      if (data.response) {
        output.innerHTML = output.innerHTML + "\nAI: " + data.response;
        chatHistory.push({ role: "user", content: promptText });
        chatHistory.push({ role: "assistant", content: data.response });
      } else {
        output.innerHTML = output.innerHTML + "\nError: " + JSON.stringify(data);
      }
    })
    .catch(function(err) {
      output.innerHTML = output.innerHTML + "\nError: " + err.message;
    });

  document.getElementById("promptBox").value = "";
}
</script>

</body>
</html>
