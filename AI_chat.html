<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI</title>
<style>
  :root {
    --bg: #0a0e14;
    --panel: #0f1620;
    --line: #1c2a38;
    --cyan: #2de2e6;
    --magenta: #ff2ec4;
    --text: #d7e6ee;
    --muted: #5c7285;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Courier New', ui-monospace, monospace;
  }
  body {
    display: flex;
    flex-direction: column;
    max-width: 720px;
    margin: 0 auto;
    padding: 0 16px;
  }
  header {
    padding: 20px 4px 14px;
    border-bottom: 1px solid var(--line);
  }
  h1 {
    margin: 0;
    font-size: 1.3rem;
    letter-spacing: 0.5px;
    color: var(--cyan);
    text-shadow: 0 0 8px rgba(45, 226, 230, 0.45);
  }
  .sub {
    margin-top: 4px;
    font-size: 0.8rem;
    color: var(--muted);
  }
  #setup {
    padding: 14px 4px;
    border-bottom: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #setup label {
    font-size: 0.72rem;
    color: var(--muted);
    text-transform: lowercase;
  }
  #setup input {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 0.85rem;
  }
  #setup input:focus { outline: none; border-color: var(--cyan); }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 16px 4px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg { max-width: 85%; padding: 10px 12px; border-radius: 6px; line-height: 1.45; font-size: 0.9rem; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: rgba(255, 46, 196, 0.12); border: 1px solid rgba(255, 46, 196, 0.4); }
  .msg.ai { align-self: flex-start; background: rgba(45, 226, 230, 0.08); border: 1px solid rgba(45, 226, 230, 0.35); }
  .msg.err { align-self: flex-start; background: rgba(255, 80, 80, 0.1); border: 1px solid rgba(255, 80, 80, 0.5); color: #ffb3b3; }
  .tag { display: block; font-size: 0.65rem; color: var(--muted); margin-bottom: 4px; letter-spacing: 0.5px; }

  form#composer {
    display: flex;
    gap: 8px;
    padding: 14px 4px 20px;
    border-top: 1px solid var(--line);
  }
  #prompt {
    flex: 1;
    resize: none;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 0.9rem;
    height: 44px;
  }
  #prompt:focus { outline: none; border-color: var(--magenta); }
  button {
    background: var(--cyan);
    color: #05161a;
    border: none;
    padding: 0 18px;
    border-radius: 4px;
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
    letter-spacing: 0.5px;
  }
  button:hover { background: #7ff0f2; }
  button:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }
</style>
</head>
<body>

<header>
  <h1>MY AI</h1>
  <div class="sub">personal endpoint · runs on your own Cloudflare Worker</div>
</header>

<div id="setup">
  <label for="workerUrl">worker url</label>
  <input id="workerUrl" type="text" placeholder="https://your-worker-name.your-subdomain.workers.dev/" value="">
  <label for="apiKey">api key</label>
  <input id="apiKey" type="password" placeholder="the value you set as API_KEY" value="">
</div>

<div id="log"></div>

<form id="composer">
  <textarea id="prompt" placeholder="Type a message…" required></textarea>
  <button id="sendBtn" type="submit">Send</button>
</form>

<script>
  const log = document.getElementById('log');
  const form = document.getElementById('composer');
  const promptEl = document.getElementById('prompt');
  const sendBtn = document.getElementById('sendBtn');
  const workerUrlEl = document.getElementById('workerUrl');
  const apiKeyEl = document.getElementById('apiKey');

  // Fill in your worker URL and API key here so you don't retype them each visit:
  workerUrlEl.value = "";
  apiKeyEl.value = "";

  let history = [];

  function addMessage(text, cls, label) {
    const div = document.createElement('div');
    div.className = 'msg ' + cls;
    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = label;
    div.appendChild(tag);
    div.appendChild(document.createTextNode(text));
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const prompt = promptEl.value.trim();
    const workerUrl = workerUrlEl.value.trim();
    const apiKey = apiKeyEl.value.trim();

    if (!prompt) return;
    if (!workerUrl || !apiKey) {
      addMessage('Fill in your worker url and api key above first.', 'err', 'setup needed');
      return;
    }

    addMessage(prompt, 'user', 'you');
    promptEl.value = '';
    sendBtn.disabled = true;
    sendBtn.textContent = '…';

    try {
      const res = await fetch(workerUrl, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${apiKey}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ prompt, history })
      });

      const data = await res.json();

      if (!res.ok) {
        addMessage(data.error || `Request failed (${res.status})`, 'err', 'error');
      } else {
        addMessage(data.response, 'ai', 'ai');
        history.push({ role: 'user', content: prompt });
        history.push({ role: 'assistant', content: data.response });
      }
    } catch (err) {
      addMessage('Could not reach the worker: ' + err.message, 'err', 'error');
    } finally {
      sendBtn.disabled = false;
      sendBtn.textContent = 'Send';
    }
  });
</script>

</body>
</html>
